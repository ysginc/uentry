name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration

      - name: Verify Docker tooling
        run: |
          sudo systemctl start docker || true
          docker --version
          docker info
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl --bins

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: ci-musl-bins
          path: |
            target/x86_64-unknown-linux-musl/release/uentry
            target/x86_64-unknown-linux-musl/release/uentry-test-probe

      - name: Run container tests
        run: cargo test --test container_tests

  build:
    name: Build Release
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [tests]
    steps:
      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: ci-musl-bins
          path: artifacts

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s artifacts/uentry)
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 5242880 ]; then
            echo "Error: Binary size exceeds 5MB limit"
            exit 1
          fi
