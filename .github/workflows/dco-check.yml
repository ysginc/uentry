name: DCO Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Verify commit sign-offs
    runs-on: ubuntu-latest
    steps:
      - name: Check all PR commits for DCO sign-off
        uses: actions/github-script@v9
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            const signoffPattern = /^Signed-off-by:\s+.+<[^>]+>\s*$/mi;
            const missing = [];

            for (const commit of commits) {
              const message = commit.commit.message || "";
              if (!signoffPattern.test(message)) {
                const title = (message.split("\n")[0] || "").trim();
                missing.push(`${commit.sha.slice(0, 7)} ${title}`);
              }
            }

            if (missing.length > 0) {
              core.setFailed(
                [
                  `Missing DCO sign-off in ${missing.length} commit(s):`,
                  ...missing,
                  "",
                  "Fix by amending each commit with:",
                  "  git commit --amend -s",
                  "or when rebasing:",
                  "  git rebase --signoff <base>",
                ].join("\n")
              );
            } else {
              core.info(`All ${commits.length} commit(s) include DCO sign-offs.`);
            }