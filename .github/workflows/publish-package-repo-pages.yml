name: Publish Package Repositories (Pages)

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: package-repo-pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build repository metadata
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_REPO_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_REPO_GPG_PRIVATE_KEY }}
      PACKAGE_REPO_GPG_PASSPHRASE: ${{ secrets.PACKAGE_REPO_GPG_PASSPHRASE }}
      PACKAGE_REPO_GPG_KEY_ID: ${{ secrets.PACKAGE_REPO_GPG_KEY_ID }}
      PACKAGE_REPO_APK_PRIVATE_KEY_B64: ${{ secrets.PACKAGE_REPO_APK_PRIVATE_KEY_B64 }}
      PACKAGE_REPO_APK_PUBLIC_KEY: ${{ secrets.PACKAGE_REPO_APK_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore package mirror cache
        id: mirror-cache
        uses: actions/cache/restore@v4
        with:
          path: site
          key: package-repo-site-${{ github.run_id }}
          restore-keys: |
            package-repo-site-

      - name: Resolve sync mode
        id: sync
        run: |
          set -euo pipefail
          echo "mode=full" >> "$GITHUB_OUTPUT"

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl gnupg createrepo-c dpkg-dev apt-utils

      - name: Ensure GitHub Pages is configured
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          response_file="$RUNNER_TEMP/pages.json"

          pages_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")"

          if [[ "$pages_status" == "404" ]]; then
            echo "GitHub Pages is not configured; attempting to create a site with GitHub Actions build_type."
            create_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url" \
              -d '{"build_type":"workflow"}')"

            if [[ "$create_status" != "201" && "$create_status" != "409" && "$create_status" != "422" ]]; then
              echo "Failed to create GitHub Pages site (HTTP ${create_status})."
              cat "$response_file"
              exit 1
            fi

            pages_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url")"
          fi

          if [[ "$pages_status" != "200" ]]; then
            echo "Unable to read GitHub Pages configuration (HTTP ${pages_status})."
            cat "$response_file"
            exit 1
          fi

          build_type="$(jq -r '.build_type // empty' "$response_file")"
          if [[ "$build_type" != "workflow" ]]; then
            echo "GitHub Pages build_type must be 'workflow' for actions/deploy-pages. Current: '${build_type:-unset}'."
            echo "Set repository Settings > Pages > Build and deployment > Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Resolve signing mode
        id: signing
        run: |
          set -euo pipefail
          required=(
            PACKAGE_REPO_GPG_PRIVATE_KEY
            PACKAGE_REPO_GPG_KEY_ID
            PACKAGE_REPO_APK_PRIVATE_KEY_B64
            PACKAGE_REPO_APK_PUBLIC_KEY
          )

          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "Missing signing secrets: ${missing[*]}"
            echo "Configure repository secrets before running publish-package-repo-pages."
            exit 1
          fi

          echo "Signing mode: signed"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Mirror package assets from releases
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYNC_MODE: ${{ steps.sync.outputs.mode }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import shutil
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sync_mode = os.environ.get("SYNC_MODE", "full")

          site_root = pathlib.Path("site")
          if sync_mode != "full":
              raise RuntimeError(f"Unsupported sync mode: {sync_mode}")
          shutil.rmtree(site_root, ignore_errors=True)

          (site_root / "rpm" / "stable").mkdir(parents=True, exist_ok=True)
          (site_root / "rpm" / "latest").mkdir(parents=True, exist_ok=True)
          (site_root / "deb" / "stable").mkdir(parents=True, exist_ok=True)
          (site_root / "deb" / "latest").mkdir(parents=True, exist_ok=True)
          (site_root / "apk" / "stable").mkdir(parents=True, exist_ok=True)
          (site_root / "apk" / "latest").mkdir(parents=True, exist_ok=True)
          (site_root / "keys").mkdir(parents=True, exist_ok=True)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "uentry-package-repo-builder",
          }

          def request_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              chunk = request_json(url)
              if not chunk:
                  break
              releases.extend(chunk)
              page += 1

          ext_map = {
              ".rpm": "rpm",
              ".deb": "deb",
              ".apk": "apk",
          }

          def safe_tag(tag: str) -> str:
              tag = tag.strip() or "untagged"
              return re.sub(r"[^0-9A-Za-z._-]+", "-", tag)

          for release in releases:
              if release.get("draft"):
                  continue

              tag_name = release.get("tag_name", "")
              is_latest_stream = bool(release.get("prerelease")) or tag_name == "latest"
              channel = "latest" if is_latest_stream else "stable"
              normalized_tag = safe_tag(tag_name)

              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  ext = pathlib.Path(name).suffix
                  if ext not in ext_map:
                      continue

                  stem = pathlib.Path(name).stem
                  parts = stem.split("-")
                  arch = parts[1] if len(parts) > 1 else "unknown"
                  libc = parts[2] if len(parts) > 2 else "unknown"

                  dest_name = f"uentry-{normalized_tag}-{arch}-{libc}{ext}"
                  if ext == ".rpm":
                      dest = site_root / "rpm" / channel / dest_name
                  elif ext == ".deb":
                      dest = site_root / "deb" / channel / "pool" / dest_name
                  else:
                      dest = site_root / "apk" / channel / arch / dest_name

                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if dest.exists():
                      dest.unlink()

                  download_url = asset["url"]
                  req = urllib.request.Request(
                      download_url,
                      headers={
                          **headers,
                          "Accept": "application/octet-stream",
                      },
                  )
                  with urllib.request.urlopen(req) as resp:
                      dest.write_bytes(resp.read())

          print(f"Release asset mirroring complete (mode={sync_mode})")
          PY

      - name: Prepare GPG keyring
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          {
            echo "allow-loopback-pinentry"
          } > "$GNUPGHOME/gpg-agent.conf"

          printf '%s\n' "$PACKAGE_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$PACKAGE_REPO_GPG_KEY_ID" >/dev/null

          gpg --batch --armor --export "$PACKAGE_REPO_GPG_KEY_ID" > site/keys/uentry-packages.asc
          gpg --batch --export "$PACKAGE_REPO_GPG_KEY_ID" > site/keys/uentry-packages.gpg

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Generate RPM metadata
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          sign_detached() {
            local input="$1"
            local output="$2"
            gpg --batch --yes --armor \
              --pinentry-mode loopback \
              --passphrase "${PACKAGE_REPO_GPG_PASSPHRASE:-}" \
              --local-user "$PACKAGE_REPO_GPG_KEY_ID" \
              --detach-sign \
              --output "$output" \
              "$input"
          }

          for channel in stable latest; do
            repo_dir="site/rpm/${channel}"
            if ! compgen -G "${repo_dir}/*.rpm" >/dev/null; then
              continue
            fi

            createrepo_c --update "$repo_dir"
            if [[ "$SIGNING_ENABLED" == "true" ]]; then
              sign_detached "${repo_dir}/repodata/repomd.xml" "${repo_dir}/repodata/repomd.xml.asc"
            fi
          done

      - name: Generate DEB metadata
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          sign_detached() {
            local input="$1"
            local output="$2"
            gpg --batch --yes --armor \
              --pinentry-mode loopback \
              --passphrase "${PACKAGE_REPO_GPG_PASSPHRASE:-}" \
              --local-user "$PACKAGE_REPO_GPG_KEY_ID" \
              --detach-sign \
              --output "$output" \
              "$input"
          }

          sign_inline() {
            local input="$1"
            local output="$2"
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "${PACKAGE_REPO_GPG_PASSPHRASE:-}" \
              --local-user "$PACKAGE_REPO_GPG_KEY_ID" \
              --clearsign \
              --output "$output" \
              "$input"
          }

          for channel in stable latest; do
            repo_dir="site/deb/${channel}"
            if ! compgen -G "${repo_dir}/pool/*.deb" >/dev/null; then
              continue
            fi

            pushd "$repo_dir" >/dev/null
            dpkg-scanpackages --multiversion pool /dev/null > Packages
            gzip -kf Packages
            apt-ftparchive release . > Release
            if [[ "$SIGNING_ENABLED" == "true" ]]; then
              sign_detached Release Release.gpg
              sign_inline Release InRelease
            fi
            popd >/dev/null
          done

      - name: Generate and sign APK indexes
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          if [[ "$SIGNING_ENABLED" == "true" ]]; then
            mkdir -p site/apk/keys
            printf '%s\n' "$PACKAGE_REPO_APK_PUBLIC_KEY" > site/apk/keys/uentry-packages.rsa.pub
          fi

          docker run --rm \
            -e PACKAGE_REPO_APK_PRIVATE_KEY_B64 \
            -e PACKAGE_REPO_APK_PUBLIC_KEY \
            -e SIGNING_ENABLED \
            -v "$PWD/site:/site" \
            alpine:3.22 \
            sh -euc '
              if [ "$SIGNING_ENABLED" = "true" ]; then
                apk add --no-cache apk-tools alpine-sdk
                mkdir -p /keys
                printf "%s" "$PACKAGE_REPO_APK_PRIVATE_KEY_B64" | base64 -d > /keys/uentry-packages.rsa
                printf "%s\n" "$PACKAGE_REPO_APK_PUBLIC_KEY" > /keys/uentry-packages.rsa.pub
                chmod 600 /keys/uentry-packages.rsa
                mkdir -p /etc/apk/keys
                cp /keys/uentry-packages.rsa.pub /etc/apk/keys/uentry-packages.rsa.pub
              else
                apk add --no-cache apk-tools
              fi

              for channel in stable latest; do
                for arch_dir in /site/apk/$channel/*; do
                  if [ ! -d "$arch_dir" ]; then
                    continue
                  fi

                  cd "$arch_dir"
                  set -- *.apk
                  if [ ! -e "$1" ]; then
                    continue
                  fi

                  if [ "$SIGNING_ENABLED" = "true" ]; then
                    for pkg in ./*.apk; do
                      if ! apk verify "$pkg" >/dev/null 2>&1; then
                        echo "Removing untrusted package: $pkg"
                        rm -f "$pkg"
                      fi
                    done

                    set -- *.apk
                    if [ ! -e "$1" ]; then
                      echo "No trusted packages remain in $arch_dir"
                      continue
                    fi
                  fi

                  apk index --output APKINDEX.tar.gz ./*.apk
                  if [ "$SIGNING_ENABLED" = "true" ]; then
                    abuild-sign -k /keys/uentry-packages.rsa APKINDEX.tar.gz
                  fi
                done
              done
            '

      - name: Build index page
        run: |
          set -euo pipefail
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>uentry package repositories</title>
          </head>
          <body>
            <h1>uentry package repositories</h1>
            <p>Channels: <code>stable</code>, <code>latest</code></p>
            <ul>
              <li>RPM: <code>/rpm/{stable|latest}</code></li>
              <li>DEB: <code>/deb/{stable|latest}</code></li>
              <li>APK: <code>/apk/{stable|latest}/&lt;arch&gt;</code></li>
            </ul>

            <h2>Signing keys</h2>
            <ul>
              <li>GPG public key: <code>/keys/uentry-packages.asc</code></li>
              <li>APK public key: <code>/apk/keys/uentry-packages.rsa.pub</code></li>
            </ul>

            <h2>Install keys (script lines)</h2>
            <p>Base URL: <code>https://ysginc.github.io/uentry</code></p>
            <pre><code>BASE_URL="https://ysginc.github.io/uentry"</code></pre>

            <h3>Debian/Ubuntu (APT)</h3>
            <pre><code>curl -fsSL "$BASE_URL/keys/uentry-packages.asc" | gpg --dearmor | sudo tee /usr/share/keyrings/uentry-packages.gpg &gt;/dev/null</code></pre>

            <h3>RHEL/Fedora (RPM/DNF)</h3>
            <pre><code>curl -fsSL "$BASE_URL/keys/uentry-packages.asc" | sudo tee /etc/pki/rpm-gpg/RPM-GPG-KEY-uentry &gt;/dev/null &amp;&amp; sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-uentry</code></pre>

            <h3>Alpine (APK)</h3>
            <pre><code>curl -fsSL "$BASE_URL/apk/keys/uentry-packages.rsa.pub" | sudo tee /etc/apk/keys/uentry-packages.rsa.pub &gt;/dev/null</code></pre>
          </body>
          </html>
          EOF

      - name: Save package mirror cache
        uses: actions/cache/save@v4
        with:
          path: site
          key: package-repo-site-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy package repositories
    needs: build-site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4