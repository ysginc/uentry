name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            libc: musl
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            libc: musl
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            libc: gnu
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            libc: gnu
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf uentry-${{ matrix.arch }}-${{ matrix.libc }}.tar.gz uentry
          sha256sum uentry-${{ matrix.arch }}-${{ matrix.libc }}.tar.gz > uentry-${{ matrix.arch }}-${{ matrix.libc }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uentry-${{ matrix.arch }}-${{ matrix.libc }}
          path: |
            target/${{ matrix.target }}/release/uentry-${{ matrix.arch }}-${{ matrix.libc }}.tar.gz
            target/${{ matrix.target }}/release/uentry-${{ matrix.arch }}-${{ matrix.libc }}.sha256

  packages:
    name: Build Packages (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            package_arch: amd64
          - arch: aarch64
            package_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download gnu binary
        uses: actions/download-artifact@v8
        with:
          name: uentry-${{ matrix.arch }}-gnu
          path: artifacts/gnu

      - name: Download musl binary
        uses: actions/download-artifact@v8
        with:
          name: uentry-${{ matrix.arch }}-musl
          path: artifacts/musl

      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.44.2/nfpm_2.44.2_Linux_x86_64.tar.gz | tar xz
          sudo mv nfpm /usr/local/bin/

      - name: Extract version
        id: version
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          if [[ "$REF_NAME" == "main" ]]; then
            echo "VERSION=0.0.0-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            TAG_NAME="$(git tag --points-at '${{ github.event.workflow_run.head_sha }}' | grep '^v' | head -n1)"
            if [[ -z "$TAG_NAME" ]]; then
              echo "Failed to determine version tag for SHA ${{ github.event.workflow_run.head_sha }}"
              exit 1
            fi
            echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        env:
          ARCH: ${{ matrix.package_arch }}
          PACKAGE_REPO_APK_PRIVATE_KEY_B64: ${{ secrets.PACKAGE_REPO_APK_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ -z "${PACKAGE_REPO_APK_PRIVATE_KEY_B64:-}" ]]; then
            echo "Missing PACKAGE_REPO_APK_PRIVATE_KEY_B64 secret required to sign APK packages"
            exit 1
          fi

          apk_sign_key_file="$(mktemp)"
          printf '%s' "$PACKAGE_REPO_APK_PRIVATE_KEY_B64" | base64 -d > "$apk_sign_key_file"
          chmod 600 "$apk_sign_key_file"

          cleanup() {
            rm -f "$apk_sign_key_file"
          }
          trap cleanup EXIT

          build_package() {
            local packager="$1"
            local libc="$2"
            local source_dir="$3"

            rm -f uentry
            tar -xzf "${source_dir}/uentry-${{ matrix.arch }}-${libc}.tar.gz"
            chmod +x uentry

            if [[ "$packager" == "apk" ]]; then
              VERSION=${{ steps.version.outputs.VERSION }} \
              NFPM_APK_KEY_FILE="$apk_sign_key_file" \
              nfpm package --packager "${packager}" --target "./dist/uentry-${{ matrix.arch }}-${libc}.${packager}"
            else
              VERSION=${{ steps.version.outputs.VERSION }} \
              nfpm package --packager "${packager}" --target "./dist/uentry-${{ matrix.arch }}-${libc}.${packager}"
            fi
          }

          build_package deb gnu artifacts/gnu
          build_package rpm gnu artifacts/gnu
          build_package apk musl artifacts/musl

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum uentry-${{ matrix.arch }}-gnu.deb > uentry-${{ matrix.arch }}-gnu.deb.sha256
          sha256sum uentry-${{ matrix.arch }}-gnu.rpm > uentry-${{ matrix.arch }}-gnu.rpm.sha256
          sha256sum uentry-${{ matrix.arch }}-musl.apk > uentry-${{ matrix.arch }}-musl.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uentry-${{ matrix.arch }}-packages
          path: dist/*

  release:
    name: Create Release
    needs: [build, packages]
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Display structure
        run: find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/uentry-*.tar.gz
            artifacts/**/uentry-*.sha256
            artifacts/**/uentry-*.deb
            artifacts/**/uentry-*.rpm
            artifacts/**/uentry-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  release-latest:
    name: Create Latest Release (main)
    needs: [build, packages]
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Remove existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Recreate latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.event.workflow_run.head_sha }}"
          git push origin refs/tags/latest --force

      - name: Create Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: |
            artifacts/**/uentry-*.tar.gz
            artifacts/**/uentry-*.sha256
            artifacts/**/uentry-*.deb
            artifacts/**/uentry-*.rpm
            artifacts/**/uentry-*.apk
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Rolling prerelease from `main`.

            Stable releases are published from version tags (`v*`).

  container:
    name: Build Container Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: uentry-x86_64-musl
          path: artifacts

      - name: Extract binary
        run: |
          tar -xzf artifacts/uentry-x86_64-musl.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          if [[ "$REF_NAME" == "main" ]]; then
            echo "VERSION=0.0.0-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            TAG_NAME="$(git tag --points-at '${{ github.event.workflow_run.head_sha }}' | grep '^v' | head -n1)"
            if [[ -z "$TAG_NAME" ]]; then
              echo "Failed to determine version tag for SHA ${{ github.event.workflow_run.head_sha }}"
              exit 1
            fi
            echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64
